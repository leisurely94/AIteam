[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-team"
version = "0.1.0"
description = "主入口对话驱动的数字人团队：说清目标，自动组队并把项目做完"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "wanglei.94" }]
keywords = ["multi-agent", "digital-human", "orchestration", "llm", "team-collaboration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
ai-team = "ai_team.cli:main"

[project.urls]
Homepage = "https://github.com/wanglei94/ai-team"

[tool.setuptools.packages.find]
include = ["ai_team*"]
